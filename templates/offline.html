<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CocoScan - Offline Portal</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2A7B4C">
    <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192x192.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="/static/js/auth_storage.js"></script>
    <style>
        :root {
            --bg-dark-green: #081C10;
            --primary-green: #2A7B4C;
            --accent-green: #4ac68f;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --bg-card: #ffffff;
            --radius-main: 24px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark-green) 0%, #113228 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        .offline-portal-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 100%;
            max-width: 480px;
            padding: 2.75rem 2.25rem;
            border-radius: var(--radius-main);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-pulse-wrapper {
            width: 86px;
            height: 86px;
            background: rgba(42, 123, 76, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            position: relative;
        }

        .icon-pulse-wrapper::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--primary-green);
            animation: pulseWave 2s infinite;
        }

        @keyframes pulseWave {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .icon-pulse-wrapper i {
            font-size: 2.2rem;
            color: var(--primary-green);
        }

        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            color: #081C10;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            line-height: 1.25;
        }

        p.description {
            font-size: 0.92rem;
            color: var(--text-muted);
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        .pwa-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(74, 198, 143, 0.15);
            color: #1a5c37;
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
        }

        .countdown-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #b91c1c;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 4px 0 6px 0;
            animation: fadeIn 0.3s ease-out;
        }

        .countdown-timer-value {
            font-size: 0.95rem;
            font-weight: 800;
            color: #991b1b;
            min-width: 24px;
            display: inline-block;
        }

        .actions-stack {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 20px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 0.92rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            box-sizing: border-box;
        }

        .btn i {
            color: inherit;
            transition: transform 0.2s ease;
        }

        .btn-primary {
            background-color: var(--primary-green);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(42, 123, 76, 0.3);
        }

        .btn-primary:hover {
            background-color: #1e5c38;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(42, 123, 76, 0.4);
        }

        .btn-secondary {
            background-color: #f1f5f9;
            color: var(--text-dark);
            border: 1px solid #e2e8f0;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-muted);
        }

        .btn-outline:hover {
            color: #081C10;
            background: rgba(0,0,0,0.03);
        }

        .status-footer {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid #f1f5f9;
            font-size: 0.82rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.5;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .countdown-timer-value {
            font-size: 0.88rem;
            font-weight: 700;
            color: #b91c1c;
            min-width: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="offline-portal-card">
        <div class="icon-pulse-wrapper">
            <i class="fa-solid fa-cloud-arrow-down" id="portal-icon"></i>
        </div>

        <div id="offline-badge" class="pwa-badge" style="display: none;">
            <i class="fa-solid fa-bolt"></i> CocoScan Offline Mode Active
        </div>

        <h1 id="offline-title">Can't load right now, you're offline</h1>
        <p id="offline-desc" class="description">
            This portal and administrative features require an active internet connection. Please check your network and reconnect to continue.
        </p>

        <div id="offline-actions" class="actions-stack">
            <!-- Dynamic Role-Based Action Buttons Rendered Below -->
        </div>

        <div class="status-footer">
            <span class="status-dot"></span> <span id="offline-footer-text">Auto-logging out in <strong id="countdown-timer-display" class="countdown-timer-value">30</strong>s if connection is not restored</span>
        </div>
    </div>

    <script>
        (function() {
            const rawRole = localStorage.getItem('cocoscan_user_role') || '';
            const role = (window.CocoScanAuth ? window.CocoScanAuth.normalizeRole(rawRole) : rawRole.toLowerCase()).trim();
            const isFarmer = role === 'farmer';

            const title = document.getElementById('offline-title');
            const desc = document.getElementById('offline-desc');
            const badge = document.getElementById('offline-badge');
            const actions = document.getElementById('offline-actions');
            const footerText = document.getElementById('offline-footer-text');
            const statusDot = document.querySelector('.status-dot');

            let logoutTimerInterval = null;
            let remainingSeconds = 30;

            function getTargetDashboardUrl() {
                if (window.CocoScanAuth && typeof window.CocoScanAuth.getRoleDashboardUrl === 'function') {
                    return window.CocoScanAuth.getRoleDashboardUrl(role);
                }
                if (role === 'farmer') return '/farmer/dashboard';
                if (role === 'agri_expert') return '/agriculturist/dashboard';
                if (role === 'admin') return '/admin/dashboard';
                if (role === 'lgu') return '/lgu/dashboard';
                return '/login';
            }

            function clearCountdownTimer() {
                if (logoutTimerInterval) {
                    clearInterval(logoutTimerInterval);
                    logoutTimerInterval = null;
                }
            }

            function performAutoLogout() {
                clearCountdownTimer();
                if (window.CocoScanAuth && typeof window.CocoScanAuth.clearActiveSession === 'function') {
                    window.CocoScanAuth.clearActiveSession();
                } else {
                    localStorage.removeItem('cocoscan_offline_active');
                    localStorage.removeItem('cocoscan_user_role');
                    localStorage.removeItem('cocoscan_user_email');
                    localStorage.removeItem('cocoscan_user_name');
                    localStorage.removeItem('cocoscan_user_first_name');
                    localStorage.removeItem('cocoscan_user_id');
                }
                window.location.href = '/logout';
            }

            function startNonFarmerLogoutCountdown() {
                clearCountdownTimer();
                remainingSeconds = 30;
                if (footerText) {
                    footerText.innerHTML = `Auto-logging out in <strong id="countdown-timer-display" class="countdown-timer-value">${remainingSeconds}</strong>s if connection is not restored`;
                }

                logoutTimerInterval = setInterval(() => {
                    remainingSeconds -= 1;
                    const liveDisplay = document.getElementById('countdown-timer-display');
                    if (liveDisplay) {
                        liveDisplay.textContent = Math.max(0, remainingSeconds);
                    }
                    if (remainingSeconds <= 0) {
                        performAutoLogout();
                    }
                }, 1000);
            }

            function attemptReconnect() {
                const btn = document.getElementById('retry-btn') || document.querySelector('#offline-actions .btn-primary');
                if (btn) {
                    const originalHtml = btn.innerHTML;
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Checking connection...';

                    setTimeout(() => {
                        if (navigator.onLine) {
                            clearCountdownTimer();
                            btn.innerHTML = '<i class="fa-solid fa-circle-check"></i> Connection restored!';
                            setTimeout(() => {
                                window.location.href = getTargetDashboardUrl();
                            }, 400);
                        } else {
                            btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Still Offline';
                            setTimeout(() => {
                                btn.disabled = false;
                                btn.innerHTML = originalHtml;
                            }, 1400);
                        }
                    }, 500);
                } else if (navigator.onLine) {
                    clearCountdownTimer();
                    window.location.href = getTargetDashboardUrl();
                }
            }

            window.attemptReconnect = attemptReconnect;
            window.performAutoLogout = performAutoLogout;

            if (isFarmer) {
                clearCountdownTimer();
                if (title) title.textContent = "You're Offline";
                if (desc) desc.textContent = "Your network connection is unavailable right now. Thanks to CocoScan PWA, you can still perform leaf scans in the field and view locally saved drafts without an internet connection.";
                if (badge) badge.style.display = "inline-flex";
                if (statusDot) statusDot.style.backgroundColor = '#2A7B4C';
                if (footerText) footerText.textContent = "Field scans will be automatically saved to your local storage until signal is restored.";
                if (actions) {
                    actions.innerHTML = `
                        <a href="/farmer/scan" class="btn btn-primary">
                            <i class="fa-solid fa-camera"></i> Open Field Scanner
                        </a>
                        <a href="/farmer/drafts" class="btn btn-secondary">
                            <i class="fa-solid fa-folder-open"></i> View Saved Offline Drafts
                        </a>
                        <a href="/farmer/dashboard" class="btn btn-outline" style="background: rgba(0,0,0,0.04);">
                            <i class="fa-solid fa-gauge"></i> Return to Farmer Dashboard
                        </a>
                        <button type="button" id="retry-btn" onclick="attemptReconnect()" class="btn btn-outline">
                            <i class="fa-solid fa-rotate-right"></i> Retry Connection
                        </button>
                        <a href="/login" class="btn btn-outline" style="font-size: 0.88rem;">
                            <i class="fa-solid fa-right-from-bracket"></i> Switch Account
                        </a>
                    `;
                }
            } else {
                // Non-Farmer Standard Generic Offline Message
                if (title) title.textContent = "Can't load right now, you're offline";
                if (desc) desc.textContent = "This portal and administrative features require an active internet connection. Please check your network and reconnect to continue.";

                if (badge) badge.style.display = "none";
                if (statusDot) statusDot.style.backgroundColor = '#ef4444';
                
                if (actions) {
                    actions.innerHTML = `
                        <button type="button" id="retry-btn" onclick="attemptReconnect()" class="btn btn-primary">
                            <i class="fa-solid fa-rotate-right"></i> Retry Connection
                        </button>
                    `;
                }

                // Start 30-Second Countdown Auto-Logout Timer for Non-Farmers
                startNonFarmerLogoutCountdown();
            }

            // When online status is restored, cancel timer and automatically redirect to proper dashboard
            window.addEventListener('online', () => {
                clearCountdownTimer();
                window.location.href = getTargetDashboardUrl();
            });
        })();
    </script>
</body>
</html>
