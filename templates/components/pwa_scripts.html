<!-- CocoScan PWA Registration, Install Prompt, Secure In-App Navigation & Speed Optimization Scripts -->
<style>
    /* PWA Floating Install Banner */
    #pwa-install-banner {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99999;
        background: #081C10;
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 16px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
        display: none;
        align-items: center;
        gap: 16px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        font-family: 'Inter', sans-serif;
        animation: pwaSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        max-width: 420px;
    }

    @keyframes pwaSlideUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .pwa-banner-icon {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: linear-gradient(135deg, rgba(74, 198, 143, 0.25) 0%, rgba(42, 123, 76, 0.3) 100%);
        border: 1px solid rgba(74, 198, 143, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.35rem;
        color: #4ac68f;
        flex-shrink: 0;
    }

    .pwa-banner-content {
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
    }

    .pwa-banner-title {
        font-size: 0.92rem;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.2px;
    }

    .pwa-banner-subtitle {
        font-size: 0.76rem;
        color: #94a3b8;
        line-height: 1.3;
    }

    .pwa-install-btn {
        background: #2A7B4C;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        box-shadow: 0 4px 10px rgba(42, 123, 76, 0.3);
    }

    .pwa-install-btn:hover {
        background: #34965e;
        transform: translateY(-1px);
    }

    .pwa-close-btn {
        background: transparent;
        color: #64748b;
        border: none;
        font-size: 1.15rem;
        cursor: pointer;
        padding: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        transition: all 0.15s ease;
    }

    .pwa-close-btn:hover {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.1);
    }

    /* PWA Toast Notifications */
    #pwa-toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        z-index: 100000;
        background: #ffffff;
        color: #1e293b;
        padding: 12px 20px;
        border-radius: 50px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(0,0,0,0.08);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        opacity: 0;
        pointer-events: none;
    }

    #pwa-toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    #pwa-toast.offline {
        background: #1e293b;
        color: #f8fafc;
        border-color: #334155;
    }

    #pwa-toast.online {
        background: #081C10;
        color: #4ac68f;
        border-color: #1b4d3e;
    }

    /* Instant Navigation Top Progress Indicator */
    #instant-nav-bar {
        position: fixed;
        top: 0;
        left: 0;
        width: 0%;
        height: 3px;
        background: linear-gradient(90deg, #4ac68f, #2A7B4C, #528265);
        z-index: 999999;
        pointer-events: none;
        transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        opacity: 0;
    }

    #instant-nav-bar.active {
        opacity: 1;
        width: 85%;
    }

    @media (max-width: 600px) {
        #pwa-install-banner {
            bottom: 12px;
            left: 12px;
            right: 12px;
            max-width: none;
            padding: 12px 16px;
        }
    }
</style>

<!-- Instant Navigation Top Indicator -->
<div id="instant-nav-bar"></div>

<!-- PWA Install Banner DOM -->
<div id="pwa-install-banner" role="dialog" aria-label="Install CocoScan Application">
    <div class="pwa-banner-icon">
        <i class="fa-solid fa-seedling"></i>
    </div>
    <div class="pwa-banner-content">
        <span class="pwa-banner-title">Install CocoScan App</span>
        <span class="pwa-banner-subtitle">Add to Home Screen for fast, offline-ready access</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px;">
        <button class="pwa-install-btn" id="pwa-trigger-btn" type="button">
            <i class="fa-solid fa-download"></i> Install
        </button>
        <button class="pwa-close-btn" id="pwa-dismiss-btn" type="button" aria-label="Dismiss Install Prompt" title="Dismiss">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>
</div>

<!-- PWA Toast DOM -->
<div id="pwa-toast">
    <i class="fa-solid fa-bell" id="pwa-toast-icon"></i>
    <span id="pwa-toast-msg">Notification</span>
</div>

<script>
(function() {
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('[PWA] Service Worker active with scope:', registration.scope);
                })
                .catch((error) => {
                    console.warn('[PWA] Service Worker registration failed:', error);
                });
        });
    }

    // Save user role and profile name for offline access logic
    let currentUserRole = "";
    let currentUserName = "";
    let currentUserEmail = "";
    let currentUserId = "";
    {% if current_user is defined and current_user.is_authenticated %}
    currentUserRole = "{{ current_user.role }}";
    currentUserName = "{{ current_user.name }}";
    currentUserEmail = "{{ current_user.email }}";
    currentUserId = "{{ current_user.id }}";
    {% elif session is defined and session.get('user_role') %}
    currentUserRole = "{{ session.get('user_role') }}";
    currentUserName = "{{ session.get('user_name') }}";
    currentUserEmail = "{{ session.get('user_email') }}";
    currentUserId = "{{ session.get('user_id') }}";
    {% elif session is defined and session.get('role') %}
    currentUserRole = "{{ session.get('role') }}";
    currentUserName = "{{ session.get('name') }}";
    currentUserEmail = "{{ session.get('email') }}";
    currentUserId = "{{ session.get('id') }}";
    {% endif %}
    if (currentUserRole && currentUserRole !== 'offline_farmer') {
        localStorage.setItem('cocoscan_user_role', currentUserRole);
    }
    const isInvalidName = (n) => !n || ['none', 'none none', 'null', 'undefined', 'farmer', 'farmer (offline)', 'user', 'account', 'administrator', 'agriculturist', 'lgu'].includes(String(n).trim().toLowerCase()) || String(n).trim().toLowerCase().startsWith('none ');
    if (currentUserName && !isInvalidName(currentUserName)) {
        localStorage.setItem('cocoscan_user_name', currentUserName);
        const firstName = currentUserName.trim().split(/\s+/)[0];
        if (firstName && !isInvalidName(firstName)) {
            localStorage.setItem('cocoscan_user_first_name', firstName);
        }
    }
    if (currentUserEmail) {
        localStorage.setItem('cocoscan_user_email', currentUserEmail);
        if (!localStorage.getItem('cocoscan_user_first_name') && currentUserEmail.includes('@')) {
            const firstSegment = currentUserEmail.split('@')[0].split(/[._-]/)[0].trim();
            if (firstSegment && !isInvalidName(firstSegment)) {
                localStorage.setItem('cocoscan_user_first_name', firstSegment.charAt(0).toUpperCase() + firstSegment.slice(1));
            }
        }
    }
    if (currentUserId && currentUserId !== 'offline_farmer') {
        localStorage.setItem('cocoscan_user_id', currentUserId);
    }

    // Sync metadata with IndexedDB if logged in online
    if (currentUserEmail && window.CocoScanAuth && typeof window.CocoScanAuth.updateCachedUserMetadata === 'function') {
        window.CocoScanAuth.updateCachedUserMetadata(currentUserEmail, {
            role: currentUserRole,
            name: currentUserName,
            userId: currentUserId
        }).catch(err => console.warn('[PWA] Metadata sync note:', err));
    }

    // 2. PWA Install Prompt Handling (Login & Dashboard Views)
    let deferredPrompt = null;
    const DISMISS_DURATION_MS = 24 * 60 * 60 * 1000; // 24 hours

    function isStandaloneMode() {
        return window.matchMedia('(display-mode: standalone)').matches || 
               window.navigator.standalone === true || 
               document.referrer.includes('android-app://');
    }

    function shouldShowInstallPrompt() {
        if (isStandaloneMode()) return false;
        
        const dismissedAt = localStorage.getItem('pwa_prompt_dismissed_at');
        if (dismissedAt) {
            const timeSinceDismiss = Date.now() - parseInt(dismissedAt, 10);
            if (timeSinceDismiss < DISMISS_DURATION_MS) {
                return false;
            }
        }

        const currentPath = window.location.pathname;
        const isEligiblePage = currentPath === '/login' || 
                               currentPath === '/' || 
                               currentPath.includes('dashboard') ||
                               currentPath.startsWith('/farmer') ||
                               currentPath.startsWith('/agriculturist') ||
                               currentPath.startsWith('/lgu') ||
                               currentPath.startsWith('/admin');
        return isEligiblePage;
    }

    function displayInstallPrompts() {
        if (!shouldShowInstallPrompt()) return;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'flex';
    }

    function hideAllInstallPrompts() {
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'none';
    }

    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default mini-infobar
        e.preventDefault();
        deferredPrompt = e;
        displayInstallPrompts();
    });

    // Check on initial page load as well
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', displayInstallPrompts);
    } else {
        displayInstallPrompts();
    }

    window.addEventListener('appinstalled', () => {
        console.log('[PWA] CocoScan was successfully installed');
        hideAllInstallPrompts();
        deferredPrompt = null;
    });

    // Handle Install Trigger Button
    const installBtn = document.getElementById('pwa-trigger-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('[PWA] User install choice:', outcome);
                deferredPrompt = null;
            } else {
                // Fallback for iOS or already triggered
                alert("To add CocoScan to your home screen:\n\n• iOS / Safari: Tap 'Share' icon (arrow up) ➔ 'Add to Home Screen'\n• Android / Chrome: Tap Menu (⋮) ➔ 'Install App'");
            }
        });
    }

    // Handle Close / Dismiss Button
    const dismissBtn = document.getElementById('pwa-dismiss-btn');
    if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) {
                banner.style.animation = 'none';
                banner.style.transition = 'opacity 0.2s, transform 0.2s';
                banner.style.opacity = '0';
                banner.style.transform = 'translateY(20px)';
                setTimeout(() => { banner.style.display = 'none'; }, 200);
            }
            localStorage.setItem('pwa_prompt_dismissed_at', String(Date.now()));
        });
    }

    // Global in-page install prompt trigger hook
    window.triggerPwaInstall = async function() {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log('[PWA] In-page choice:', outcome);
            deferredPrompt = null;
        } else {
            alert("To add CocoScan to your home screen:\n\n• On iOS/Safari: Tap 'Share' ➔ 'Add to Home Screen'\n• On Android/Chrome: Tap 'Menu' (⋮) ➔ 'Install App'");
        }
    };

    window.dismissPwaPromptCard = function(elementId) {
        const el = document.getElementById(elementId);
        if (el) {
            el.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(() => { el.style.display = 'none'; }, 250);
        }
        localStorage.setItem('pwa_prompt_dismissed_at', String(Date.now()));
    };

    window.dismissInPagePwaPrompt = function(elementId) {
        window.dismissPwaPromptCard(elementId || 'in-page-pwa-prompt');
    };

    // 3. Secure In-App Back Navigation Engine
    window.handleInAppBackNavigation = function() {
        const currentPath = window.location.pathname;
        const role = (localStorage.getItem('cocoscan_user_role') || currentUserRole || '').toLowerCase();

        const roleDashboards = {
            'admin': '/admin/dashboard',
            'lgu': '/lgu/dashboard',
            'agriculturist': '/agriculturist/dashboard',
            'agri_expert': '/agriculturist/dashboard',
            'farmer': '/farmer/dashboard'
        };

        const targetDashboard = roleDashboards[role] || '/login';

        // If currently on the root dashboard page of this role
        const isRootDashboard = currentPath === targetDashboard || 
                                currentPath === '/admin/dashboard' || 
                                currentPath === '/lgu/dashboard' || 
                                currentPath === '/agriculturist/dashboard' || 
                                currentPath === '/farmer/dashboard' ||
                                currentPath === '/dashboard';

        if (isRootDashboard) {
            // Re-validate session integrity
            fetch('/api/auth/session-check', { credentials: 'same-origin' })
                .then(res => res.json())
                .then(data => {
                    if (!data || !data.authenticated) {
                        window.location.replace('/login');
                    }
                })
                .catch(() => {});
            return;
        }

        // Verify if safe in-app history exists
        const hasSafeHistory = window.history.length > 1 && 
                              document.referrer && 
                              document.referrer.startsWith(window.location.origin) &&
                              !document.referrer.includes('/login') &&
                              !document.referrer.includes('/logout') &&
                              !document.referrer.includes('/verify-2fa') &&
                              !document.referrer.includes('/account-notice');

        if (hasSafeHistory) {
            window.history.back();
        } else {
            window.location.href = targetDashboard;
        }
    };

    // bfcache (Back-Forward Cache) Security Validation Listener
    window.addEventListener('pageshow', function(event) {
        // If page was restored from browser cache after back navigation
        if (event.persisted) {
            const currentPath = window.location.pathname;
            const isProtectedPath = currentPath.startsWith('/admin') ||
                                    currentPath.startsWith('/lgu') ||
                                    currentPath.startsWith('/agriculturist') ||
                                    currentPath.startsWith('/farmer') ||
                                    currentPath.startsWith('/reports');

            if (isProtectedPath) {
                fetch('/api/auth/session-check', { credentials: 'same-origin' })
                    .then(res => {
                        if (!res.ok) {
                            window.location.replace('/login');
                        }
                        return res.json();
                    })
                    .then(data => {
                        if (!data || !data.authenticated) {
                            window.location.replace('/login');
                        }
                    })
                    .catch(() => {
                        if (!navigator.onLine) {
                            // Offline verification
                            const offlineActive = document.cookie.includes('cocoscan_offline_active=1');
                            if (!offlineActive && !localStorage.getItem('cocoscan_user_role')) {
                                window.location.replace('/login');
                            }
                        }
                    });
            }
        }
    });

    // 4. Discreet Sync Status Management (Exclusively for Farmers) & Non-Farmer Offline Redirection
    function formatLastSyncTime(dateStr) {
        if (!dateStr) return 'just now';
        try {
            const dt = new Date(dateStr);
            if (isNaN(dt.getTime())) return 'just now';
            return new Intl.DateTimeFormat('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            }).format(dt);
        } catch (e) {
            return 'just now';
        }
    }

    function enforceRoleOfflinePolicy() {
        if (!navigator.onLine) {
            const currentPath = window.location.pathname;
            // Never redirect public authentication or offline informational pages
            const isPublicAuthPage = currentPath === '/login' ||
                                    currentPath === '/signup' ||
                                    currentPath === '/forgot-password' ||
                                    currentPath === '/reset-password' ||
                                    currentPath === '/verify-2fa' ||
                                    currentPath === '/' ||
                                    currentPath.startsWith('/offline');

            if (isPublicAuthPage) {
                return;
            }

            const role = (localStorage.getItem('cocoscan_user_role') || currentUserRole || '').toLowerCase();
            const isNonFarmer = role && role !== 'farmer' && role !== 'offline_farmer';
            const isNonFarmerPage = currentPath.startsWith('/admin') ||
                                    currentPath.startsWith('/agriculturist') ||
                                    currentPath.startsWith('/lgu') ||
                                    currentPath.startsWith('/overview') ||
                                    currentPath.startsWith('/map') ||
                                    currentPath.startsWith('/analytics');
            if (isNonFarmer || isNonFarmerPage) {
                window.location.href = '/offline';
            }
        }
    }

    function updateDashboardSyncStatus() {
        const syncStatusWrapper = document.getElementById('dashboard-sync-status');
        const role = (localStorage.getItem('cocoscan_user_role') || currentUserRole || '').toLowerCase();
        const isFarmer = role === 'farmer';

        if (!isFarmer && syncStatusWrapper) {
            syncStatusWrapper.style.display = 'none';
            return;
        }

        const dot = document.getElementById('sync-dot');
        const text = document.getElementById('sync-status-text');
        const time = document.getElementById('sync-status-time');
        if (!dot && !text) return;

        if (navigator.onLine) {
            const nowIso = new Date().toISOString();
            localStorage.setItem('cocoscan_last_sync', nowIso);
            if (dot) dot.style.backgroundColor = '#22c55e';
            if (text) {
                text.textContent = 'Online';
                text.style.color = '#15803d';
            }
            if (time) time.textContent = '• Synced ' + formatLastSyncTime(nowIso);
        } else {
            const lastSync = localStorage.getItem('cocoscan_last_sync');
            if (dot) dot.style.backgroundColor = '#f59e0b';
            if (text) {
                text.textContent = 'Offline';
                text.style.color = '#b45309';
            }
            if (time) time.textContent = lastSync ? ('• Last sync: ' + formatLastSyncTime(lastSync)) : '• Local mode';
        }
    }

    window.addEventListener('offline', () => {
        enforceRoleOfflinePolicy();
        updateDashboardSyncStatus();
    });

    window.addEventListener('online', () => {
        updateDashboardSyncStatus();
    });

    // 5. Instant Link Prefetcher & Fast Navigation Engine
    const prefetchedUrls = new Set();
    function prefetchUrl(url) {
        if (!url || prefetchedUrls.has(url)) return;
        try {
            const parsed = new URL(url, window.location.origin);
            if (parsed.origin !== window.location.origin) return;
            if (parsed.pathname === window.location.pathname && parsed.search === window.location.search) return;
            if (parsed.pathname.startsWith('/logout') || parsed.pathname.includes('/delete') || parsed.pathname.includes('/submit')) return;

            prefetchedUrls.add(parsed.href);

            const link = document.createElement('link');
            link.rel = 'prefetch';
            link.href = parsed.href;
            link.as = 'document';
            document.head.appendChild(link);
        } catch (e) {}
    }

    function initInstantNavigation() {
        const navBar = document.getElementById('instant-nav-bar');

        // Prefetch on pointerenter (hover) and touchstart
        document.addEventListener('pointerenter', (e) => {
            const target = e.target.closest('a');
            if (target && target.href && !target.hasAttribute('download') && target.target !== '_blank') {
                prefetchUrl(target.href);
            }
        }, { passive: true, capture: true });

        document.addEventListener('touchstart', (e) => {
            const target = e.target.closest('a');
            if (target && target.href && !target.hasAttribute('download') && target.target !== '_blank') {
                prefetchUrl(target.href);
            }
        }, { passive: true, capture: true });

        // Instant visual feedback on sidebar navigation clicks
        document.addEventListener('click', (e) => {
            const target = e.target.closest('.menu-item-link, .bottom-nav-item, a[href^="/"]');
            if (!target || !target.href) return;

            const parsed = new URL(target.href, window.location.origin);
            if (parsed.origin !== window.location.origin) return;
            if (parsed.pathname.startsWith('/logout') || parsed.pathname.includes('/delete') || target.hasAttribute('download') || target.target === '_blank') return;

            if (parsed.pathname !== window.location.pathname) {
                if (navBar) {
                    navBar.classList.add('active');
                }
                if (target.classList.contains('menu-item-link')) {
                    document.querySelectorAll('.menu-item-link').forEach(el => el.classList.remove('active'));
                    target.classList.add('active');
                }
                const sidebar = document.getElementById('sidebar');
                const backdrop = document.getElementById('backdrop');
                if (sidebar && sidebar.classList.contains('show-mobile')) {
                    sidebar.classList.remove('show-mobile');
                    if (backdrop) backdrop.classList.remove('active');
                }
            }
        }, { capture: true });
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', () => {
        enforceRoleOfflinePolicy();
        updateDashboardSyncStatus();
        initInstantNavigation();
    });
    enforceRoleOfflinePolicy();
    updateDashboardSyncStatus();
    initInstantNavigation();
})();
</script>
