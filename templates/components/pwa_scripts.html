<!-- CocoScan PWA Registration, Install Prompt & Speed Optimization Scripts -->
<style>
    /* PWA Floating Install Banner */
    #pwa-install-banner {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99999;
        background: #081C10;
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        display: none;
        align-items: center;
        gap: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        font-family: 'Inter', sans-serif;
        animation: pwaSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pwaSlideUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .pwa-banner-content {
        display: flex;
        flex-direction: column;
    }

    .pwa-banner-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #ffffff;
    }

    .pwa-banner-subtitle {
        font-size: 0.75rem;
        color: #94a3b8;
    }

    .pwa-install-btn {
        background: #2A7B4C;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
    }

    .pwa-install-btn:hover {
        background: #34965e;
    }

    .pwa-close-btn {
        background: transparent;
        color: #64748b;
        border: none;
        font-size: 1.1rem;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
    }

    .pwa-close-btn:hover {
        color: #ffffff;
    }

    /* PWA Toast Notifications for Offline/Online and Cache Updates */
    #pwa-toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        z-index: 100000;
        background: #ffffff;
        color: #1e293b;
        padding: 12px 20px;
        border-radius: 50px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(0,0,0,0.08);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        opacity: 0;
        pointer-events: none;
    }

    #pwa-toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    #pwa-toast.offline {
        background: #1e293b;
        color: #f8fafc;
        border-color: #334155;
    }

    #pwa-toast.online {
        background: #081C10;
        color: #4ac68f;
        border-color: #1b4d3e;
    }

    #pwa-toast.update {
        background: #2A7B4C;
        color: #ffffff;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        #pwa-install-banner {
            bottom: 12px;
            left: 12px;
            right: 12px;
            justify-content: space-between;
        }
    }
</style>

<!-- PWA Install Banner DOM -->
<div id="pwa-install-banner">
    <div style="display:flex; align-items:center; gap:12px;">
        <i class="fa-solid fa-tree-city" style="font-size: 1.6rem; color: #4ac68f;"></i>
        <div class="pwa-banner-content">
            <span class="pwa-banner-title">Install CocoScan App</span>
            <span class="pwa-banner-subtitle"> Feels like a native mobile application</span>
        </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
        <button class="pwa-install-btn" id="pwa-trigger-btn">Install</button>
        <button class="pwa-close-btn" onclick="document.getElementById('pwa-install-banner').style.display='none'; localStorage.setItem('pwa_dismissed', 'true');"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<!-- PWA Toast DOM -->
<div id="pwa-toast">
    <i class="fa-solid fa-bell" id="pwa-toast-icon"></i>
    <span id="pwa-toast-msg">Notification</span>
</div>

<script>
(function() {
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('[PWA] Service Worker active with scope:', registration.scope);
                })
                .catch((error) => {
                    console.warn('[PWA] Service Worker registration failed:', error);
                });
        });
    }

    // Save user role for offline access logic
    let currentUserRole = "";
    {% if current_user is defined and current_user.is_authenticated %}
    currentUserRole = "{{ current_user.role }}";
    {% elif session is defined and session.get('user_role') %}
    currentUserRole = "{{ session.get('user_role') }}";
    {% elif session is defined and session.get('role') %}
    currentUserRole = "{{ session.get('role') }}";
    {% endif %}
    if (currentUserRole) {
        localStorage.setItem('cocoscan_user_role', currentUserRole);
    }

    // 2. Install Prompt Handling
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default browser banner
        e.preventDefault();
        deferredPrompt = e;
        // Check if user previously dismissed banner and we are on a dashboard page
        if (!localStorage.getItem('pwa_dismissed') && window.location.pathname.includes('dashboard')) {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'flex';
        }
    });

    const installBtn = document.getElementById('pwa-trigger-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('[PWA] User install prompt choice:', outcome);
                deferredPrompt = null;
            }
        });
    }

    // 3. Discreet Sync Status Management (Exclusively for Farmers)
    function formatLastSyncTime(dateStr) {
        if (!dateStr) return 'just now';
        try {
            const dt = new Date(dateStr);
            if (isNaN(dt.getTime())) return 'just now';
            return new Intl.DateTimeFormat('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            }).format(dt);
        } catch (e) {
            return 'just now';
        }
    }

    function updateDashboardSyncStatus() {
        const syncStatusWrapper = document.getElementById('dashboard-sync-status');
        const role = (localStorage.getItem('cocoscan_user_role') || currentUserRole || '').toLowerCase();
        const isFarmer = role === 'farmer';

        if (!isFarmer && syncStatusWrapper) {
            syncStatusWrapper.style.display = 'none';
            return;
        }

        const dot = document.getElementById('sync-dot');
        const text = document.getElementById('sync-status-text');
        const time = document.getElementById('sync-status-time');
        if (!dot && !text) return;

        if (navigator.onLine) {
            const nowIso = new Date().toISOString();
            localStorage.setItem('cocoscan_last_sync', nowIso);
            if (dot) dot.style.backgroundColor = '#22c55e';
            if (text) {
                text.textContent = 'Online';
                text.style.color = '#15803d';
            }
            if (time) time.textContent = '• Synced ' + formatLastSyncTime(nowIso);
        } else {
            const lastSync = localStorage.getItem('cocoscan_last_sync');
            if (dot) dot.style.backgroundColor = '#f59e0b';
            if (text) {
                text.textContent = 'Offline';
                text.style.color = '#b45309';
            }
            if (time) time.textContent = lastSync ? ('• Last sync: ' + formatLastSyncTime(lastSync)) : '• Local mode';
        }
    }

    window.addEventListener('offline', () => {
        updateDashboardSyncStatus();
    });

    window.addEventListener('online', () => {
        updateDashboardSyncStatus();
    });

    // Initialize sync status on load without annoying floating popups
    document.addEventListener('DOMContentLoaded', () => {
        updateDashboardSyncStatus();
    });
    updateDashboardSyncStatus();
})();
</script>
