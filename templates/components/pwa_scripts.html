<!-- CocoScan PWA Registration, Install Prompt & Speed Optimization Scripts -->
<style>
    /* PWA Floating Install Banner */
    #pwa-install-banner {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 99999;
        background: #081C10;
        color: #ffffff;
        padding: 14px 20px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        display: none;
        align-items: center;
        gap: 14px;
        border: 1px solid rgba(255,255,255,0.15);
        font-family: 'Inter', sans-serif;
        animation: pwaSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes pwaSlideUp {
        from { transform: translateY(100px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    .pwa-banner-content {
        display: flex;
        flex-direction: column;
    }

    .pwa-banner-title {
        font-size: 0.9rem;
        font-weight: 700;
        color: #ffffff;
    }

    .pwa-banner-subtitle {
        font-size: 0.75rem;
        color: #94a3b8;
    }

    .pwa-install-btn {
        background: #2A7B4C;
        color: #ffffff;
        border: none;
        padding: 8px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
    }

    .pwa-install-btn:hover {
        background: #34965e;
    }

    .pwa-close-btn {
        background: transparent;
        color: #64748b;
        border: none;
        font-size: 1.1rem;
        cursor: pointer;
        padding: 4px;
        display: flex;
        align-items: center;
    }

    .pwa-close-btn:hover {
        color: #ffffff;
    }

    /* PWA Toast Notifications for Offline/Online and Cache Updates */
    #pwa-toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        z-index: 100000;
        background: #ffffff;
        color: #1e293b;
        padding: 12px 20px;
        border-radius: 50px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid rgba(0,0,0,0.08);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s;
        opacity: 0;
        pointer-events: none;
    }

    #pwa-toast.show {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
        pointer-events: auto;
    }

    #pwa-toast.offline {
        background: #1e293b;
        color: #f8fafc;
        border-color: #334155;
    }

    #pwa-toast.online {
        background: #081C10;
        color: #4ac68f;
        border-color: #1b4d3e;
    }

    #pwa-toast.update {
        background: #2A7B4C;
        color: #ffffff;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        #pwa-install-banner {
            bottom: 12px;
            left: 12px;
            right: 12px;
            justify-content: space-between;
        }
    }
</style>

<!-- PWA Install Banner DOM -->
<div id="pwa-install-banner">
    <div style="display:flex; align-items:center; gap:12px;">
        <i class="fa-solid fa-tree-city" style="font-size: 1.6rem; color: #4ac68f;"></i>
        <div class="pwa-banner-content">
            <span class="pwa-banner-title">Install CocoScan App</span>
            <span class="pwa-banner-subtitle">Fast offline access & instant loading</span>
        </div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
        <button class="pwa-install-btn" id="pwa-trigger-btn">Install</button>
        <button class="pwa-close-btn" onclick="document.getElementById('pwa-install-banner').style.display='none'; localStorage.setItem('pwa_dismissed', 'true');"><i class="fa-solid fa-xmark"></i></button>
    </div>
</div>

<!-- PWA Toast DOM -->
<div id="pwa-toast">
    <i class="fa-solid fa-bell" id="pwa-toast-icon"></i>
    <span id="pwa-toast-msg">Notification</span>
</div>

<script>
(function() {
    // 1. Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then((registration) => {
                    console.log('[PWA] Service Worker active with scope:', registration.scope);
                })
                .catch((error) => {
                    console.warn('[PWA] Service Worker registration failed:', error);
                });
        });
    }

    // Save user role for offline access logic
    let currentUserRole = "";
    {% if current_user is defined and current_user.is_authenticated %}
    currentUserRole = "{{ current_user.role }}";
    {% elif session is defined and session.get('role') %}
    currentUserRole = "{{ session.get('role') }}";
    {% endif %}
    if (currentUserRole) {
        localStorage.setItem('cocoscan_user_role', currentUserRole);
    }

    // 2. Install Prompt Handling
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent default browser banner
        e.preventDefault();
        deferredPrompt = e;
        // Check if user previously dismissed banner and we are on a dashboard page
        if (!localStorage.getItem('pwa_dismissed') && window.location.pathname.includes('dashboard')) {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'flex';
        }
    });

    const installBtn = document.getElementById('pwa-trigger-btn');
    if (installBtn) {
        installBtn.addEventListener('click', async () => {
            const banner = document.getElementById('pwa-install-banner');
            if (banner) banner.style.display = 'none';
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log('[PWA] User install prompt choice:', outcome);
                deferredPrompt = null;
            }
        });
    }

    // 3. Online / Offline Status Toast
    function showPwaToast(message, type = '', duration = 4000, onClick = null) {
        const toast = document.getElementById('pwa-toast');
        const icon = document.getElementById('pwa-toast-icon');
        const msg = document.getElementById('pwa-toast-msg');
        if (!toast || !msg) return;

        toast.className = 'show ' + type;
        msg.textContent = message;
        toast.onclick = onClick ? onClick : null;

        if (type === 'offline') icon.className = 'fa-solid fa-wifi-slash';
        else if (type === 'online') icon.className = 'fa-solid fa-wifi';
        else if (type === 'update') icon.className = 'fa-solid fa-bolt-lightning';
        else icon.className = 'fa-solid fa-bell';

        setTimeout(() => {
            if (toast.classList.contains('show')) {
                toast.className = '';
            }
        }, duration);
    }

    window.addEventListener('offline', () => {
        showPwaToast('You are offline. Scans will be saved to local Drafts.', 'offline', 6000);
    });

    window.addEventListener('online', () => {
        showPwaToast('Back online! Ready to sync offline reports.', 'online', 4000);
    });

    // Check initial status
    if (!navigator.onLine) {
        setTimeout(() => {
            showPwaToast('Working in offline mode.', 'offline', 5000);
        }, 1000);
    }
})();
</script>
