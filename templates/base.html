<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CocoScan - Coconut Pest Detection</title>
    {% include 'components/pwa_head.html' %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* The Makeover Palette */
            --bg-dark-green: #081C10;   /* Deeper, more luxurious backdrop */
            --primary-green: #2A7B4C;   /* Vibrant leaf for accents & logo */
            --primary-hover: #113228;   /* Dark emerald for button hover states */
            --button-base: #1B4D3E;     /* Confident action color */
            --accent-light: #F4F7F5;    /* Sage tint for inputs instead of flat white */
            
            /* Typography & Borders */
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --radius-main: 20px;        /* Slightly rounder corners for a friendlier feel */
            --radius-input: 10px;       /* Sleeker input tracking */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark-green);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text-dark);
        }

        /* Modernized Elegant Glass/Card Layout */
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 3rem 2.5rem;
            margin: 2.5rem auto;
            border-radius: var(--radius-main);
            box-shadow: var(--shadow-md);
            animation: fadeIn 0.4s ease-out;
            position: relative;
        }

        .auth-card.wide-card {
            max-width: 520px;
            padding: 3rem 2.5rem;
        }

        .btn-auth-back {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            color: #475569;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        .btn-auth-back:hover {
            background: #e2e8f0;
            color: var(--primary-green);
            transform: translateX(-2px);
        }

        .btn-auth-back:active {
            transform: translateX(-3px) scale(0.95);
        }

        /* SVG Vector Logo Styling */
        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.25rem;
            text-align: center;
        }

        .logo-icon-wrap {
            color: var(--primary-green);
            font-size: 2.75rem;
            margin-bottom: 0.85rem;
            position: relative;
        }

        .logo-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--primary-green);
            letter-spacing: -0.3px;
            line-height: 1.3;
            margin-bottom: 0.35rem;
        }

        .logo-subtitle {
            font-size: 0.9rem;
            font-weight: 500;
            line-height: 1.5;
            color: #64748b;
            margin-top: 6px;
            max-width: 95%;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
            position: relative;
        }

        .form-row {
            display: grid;
            grid-template-columns: 3fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-dark);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon-left {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .input-wrapper i.toggle-password {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 0.85rem;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-input);
            background-color: #f9fafb;
            color: var(--text-dark);
            transition: all 0.2s ease;
            outline: none;
        }

        .has-icon-left input {
            padding-left: 2.3rem;
        }

        input:focus, select:focus {
            background-color: #fff;
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.15);
        }

        /* Prevent unwanted yellow/blue browser autofill backgrounds across all webkit browsers */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active,
        select:-webkit-autofill,
        select:-webkit-autofill:hover,
        select:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #f9fafb inset !important;
            box-shadow: 0 0 0 1000px #f9fafb inset !important;
            -webkit-text-fill-color: var(--text-dark, #1F2937) !important;
            color: var(--text-dark, #1F2937) !important;
            caret-color: var(--text-dark, #1F2937) !important;
            border-color: var(--border-color, #E5E7EB) !important;
            transition: background-color 50000s ease-in-out 0s, color 50000s ease-in-out 0s !important;
        }

        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #ffffff inset, 0 0 0 3px rgba(45, 106, 79, 0.15) !important;
            box-shadow: 0 0 0 1000px #ffffff inset, 0 0 0 3px rgba(45, 106, 79, 0.15) !important;
            border-color: var(--primary-green, #2A7B4C) !important;
        }

        /* Buttons */
        .btn-primary {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding: 0.85rem;
            background-color: var(--primary-green);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-input);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary:focus,
        .btn-primary:focus-visible,
        .btn-primary:active {
            outline: none !important;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.25);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.99);
        }

        /* Loading Button State & Animated Loading Bar */
        .btn-primary.btn-loading,
        .btn-control.btn-loading,
        .btn-loading {
            position: relative !important;
            overflow: hidden !important;
            pointer-events: none !important;
            cursor: wait !important;
            opacity: 0.92 !important;
        }

        .btn-loading-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.35);
            overflow: hidden;
            border-radius: 0 0 var(--radius-input, 10px) var(--radius-input, 10px);
            z-index: 5;
        }

        .btn-loading-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            border-radius: 4px;
            animation: btn-loading-bar-anim 1.2s infinite ease-in-out;
        }

        @keyframes btn-loading-bar-anim {
            0% { left: -50%; }
            50% { left: 35%; width: 60%; }
            100% { left: 100%; width: 50%; }
        }

        /* Footer Utilities */
        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .login-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: -0.25rem;
            margin-bottom: 1.25rem;
            font-size: 0.85rem;
        }

        .remember-me-label {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            color: var(--text-dark);
            user-select: none;
            margin-bottom: 0;
            transition: color 0.15s ease;
        }

        .remember-me-label:hover {
            color: var(--primary-green);
        }

        .remember-me-label input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--primary-green);
            cursor: pointer;
            border-radius: 4px;
            margin: 0;
            vertical-align: middle;
        }

        .login-options-row .forgot-password {
            margin-top: 0;
            margin-bottom: 0;
            font-size: 0.85rem;
        }

        .forgot-password {
            display: block;
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            margin-top: -0.75rem;
            margin-bottom: 1.25rem;
        }

        .forgot-password:hover {
            color: var(--primary-green);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>

    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}
    {% include 'components/pwa_scripts.html' %}
    <script>
        (function() {
            function setButtonLoading(btn, customText) {
                if (!btn || btn.classList.contains('btn-loading')) return;
                if (!btn.dataset.defaultHtml) {
                    btn.dataset.defaultHtml = btn.innerHTML;
                }
                const currentText = (btn.textContent || btn.innerText || '').trim();
                let loadingText = customText;
                if (!loadingText) {
                    const lower = currentText.toLowerCase();
                    if (lower.includes('login') || lower.includes('log in')) loadingText = 'Logging in...';
                    else if (lower.includes('sign up') || lower.includes('signup') || lower.includes('register') || lower.includes('create account')) loadingText = 'Creating Account...';
                    else if (lower.includes('send') || lower.includes('resend')) loadingText = 'Sending Code...';
                    else if (lower.includes('verify')) loadingText = 'Verifying...';
                    else if (lower.includes('reset')) loadingText = 'Resetting Password...';
                    else if (lower.includes('save')) loadingText = 'Saving...';
                    else if (lower.includes('submit')) loadingText = 'Submitting...';
                    else loadingText = 'Processing...';
                }

                // Lock button dimensions so layout does not shift
                const minWidth = btn.offsetWidth;
                const minHeight = btn.offsetHeight;
                if (minWidth) btn.style.minWidth = minWidth + 'px';
                if (minHeight) btn.style.minHeight = minHeight + 'px';

                btn.classList.add('btn-loading');
                btn.setAttribute('aria-busy', 'true');
                btn.innerHTML = `
                    <span style="display:inline-flex; align-items:center; gap:8px;">
                        <i class="fa-solid fa-circle-notch fa-spin"></i> ${loadingText}
                    </span>
                    <span class="btn-loading-bar"></span>
                `;
            }

            function resetButtonLoading(btn) {
                if (!btn) return;
                btn.classList.remove('btn-loading');
                btn.removeAttribute('aria-busy');
                btn.style.minWidth = '';
                btn.style.minHeight = '';
                if (btn.dataset.defaultHtml) {
                    btn.innerHTML = btn.dataset.defaultHtml;
                    delete btn.dataset.defaultHtml;
                }
            }

            function initFormLoaders() {
                document.querySelectorAll('form').forEach(form => {
                    if (form.dataset.loadingInitialized) return;
                    form.dataset.loadingInitialized = 'true';

                    const submitButtons = form.querySelectorAll('button[type="submit"], input[type="submit"], button:not([type]), .btn-primary');

                    form.addEventListener('submit', function(e) {
                        if (e.defaultPrevented) return;
                        if (typeof form.checkValidity === 'function' && !form.checkValidity()) {
                            return;
                        }
                        if (form.dataset.submitting === 'true') {
                            e.preventDefault();
                            return;
                        }
                        form.dataset.submitting = 'true';

                        const activeBtn = form.querySelector('button[type="submit"], .btn-primary, button:not([type])');
                        if (activeBtn) {
                            setButtonLoading(activeBtn);
                        }
                    });

                    submitButtons.forEach(btn => {
                        btn.addEventListener('click', function() {
                            if (btn.classList.contains('btn-loading') || form.dataset.submitting === 'true') {
                                return;
                            }
                            if (typeof form.checkValidity === 'function' && !form.checkValidity()) {
                                return;
                            }
                            setButtonLoading(btn);
                        });
                    });
                });
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initFormLoaders);
            } else {
                initFormLoaders();
            }

            window.addEventListener('pageshow', function() {
                document.querySelectorAll('form').forEach(form => {
                    form.dataset.submitting = 'false';
                    form.querySelectorAll('.btn-loading').forEach(btn => {
                        resetButtonLoading(btn);
                    });
                });
            });
        })();
    </script>
</body>
</html>
